<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr.Yun — чат-виджет</title>
<style>
:root{--forest:#145a49;--deep:#0d493d;--ink:#203a30;--muted:#829087;--paper:#fffefa;--line:#e7ece7;--mint:#edf5ec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 78% 22%,rgba(207,230,211,.46),transparent 30%),radial-gradient(ellipse at 13% 83%,rgba(241,235,215,.45),transparent 27%),#f8f8f3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button,input{font:inherit}
#dr-yun-chat{position:fixed;right:24px;bottom:22px;z-index:999999}
.chat-panel{position:absolute;right:0;bottom:82px;width:390px;height:min(620px,calc(100dvh - 125px));min-height:420px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(230,238,231,.95);border-radius:28px;background:var(--paper);box-shadow:0 28px 90px rgba(18,49,39,.22),0 5px 16px rgba(18,49,39,.06);transform:translateY(12px) scale(.98);transform-origin:bottom right;opacity:0;visibility:hidden;transition:opacity .22s,transform .28s cubic-bezier(.2,.8,.2,1),visibility .22s}
.chat-panel.open{transform:none;opacity:1;visibility:visible}
.chat-head{height:108px;flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;padding:19px 20px;color:#fff;background:radial-gradient(ellipse at 96% 0%,rgba(188,230,190,.25),transparent 36%),radial-gradient(ellipse at 65% 115%,rgba(101,177,133,.25),transparent 38%),linear-gradient(127deg,#176451,#0d493d)}
.chat-head:after{content:"";position:absolute;right:-48px;top:-92px;width:208px;height:208px;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 18px rgba(255,255,255,.035),0 0 0 40px rgba(255,255,255,.025);pointer-events:none}
.brand-icon{width:49px;height:49px;flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.34);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.brand-icon svg{width:29px;height:29px}
.brand-copy{min-width:0;position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:7px;margin:0 0 3px;color:rgba(242,250,243,.76);font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:#c4e68c;box-shadow:0 0 10px #c4e68c}
.brand-title{margin:0;font-family:Georgia,Cambria,serif;font-size:21px;font-weight:500;letter-spacing:-.02em}
.brand-subtitle{margin:3px 0 0;color:rgba(239,248,241,.75);font-size:11px}
.close{position:relative;z-index:2;width:34px;height:34px;margin-left:auto;flex:none;display:grid;place-items:center;border:1px solid rgba(255,255,255,.23);border-radius:12px;color:#fff;background:rgba(255,255,255,.1);cursor:pointer;transition:background .2s,transform .2s}
.close:hover{background:rgba(255,255,255,.2);transform:rotate(6deg)}
.close svg{width:15px;height:15px}
.messages{flex:1;min-height:0;overflow:auto;padding:19px 17px 12px;background:radial-gradient(ellipse at 0 0,rgba(225,240,229,.42),transparent 40%),linear-gradient(180deg,#fcfdfa,#fffefa);scroll-behavior:smooth}
.day{width:max-content;margin:0 auto 17px;padding:5px 10px;border:1px solid #edf0ec;border-radius:99px;color:#98a39c;background:rgba(255,255,255,.85);font-size:9px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
.message{display:flex;align-items:flex-end;gap:8px;margin-bottom:13px;animation:arrive .25s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.message.user{justify-content:flex-end}
.tooth{width:25px;height:25px;flex:none;display:grid;place-items:center;border:1px solid #e1ebe2;border-radius:9px;color:#226450;background:linear-gradient(145deg,#f4f8ee,#e5f0e5)}
.tooth svg{width:15px;height:15px}
.stack{max-width:83%;display:flex;flex-direction:column;gap:4px}
.bubble{padding:11px 13px;border:1px solid #e9eeea;border-radius:17px 17px 17px 5px;color:#29463b;background:#fff;box-shadow:0 3px 12px rgba(24,53,46,.035);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{border-color:#17654f;border-radius:17px 17px 5px 17px;color:#fff;background:linear-gradient(145deg,#287a62,#17604d);box-shadow:0 5px 14px rgba(28,105,80,.16)}
.stamp{padding:0 3px;color:#a0aaa4;font-size:9px}.user .stamp{text-align:right}
.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin:3px 0 18px 33px;animation:arrive .35s .08s ease both}
.suggestions button{padding:8px 11px;border:1px solid #dce8dc;border-radius:99px;color:#27614d;background:rgba(244,249,241,.92);font-size:11px;font-weight:650;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.suggestions button:hover{border-color:#a8c8ad;background:#edf5e8;transform:translateY(-1px)}
.typing{display:flex;align-items:flex-end;gap:8px;margin:1px 0 12px}
.dots{height:33px;padding:0 12px;display:flex;align-items:center;gap:4px;border:1px solid #e9eeea;border-radius:15px 15px 15px 5px;background:#fff}
.dots i{width:5px;height:5px;border-radius:50%;background:#82a493;animation:bounce 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.13s}.dots i:nth-child(3){animation-delay:.26s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}
.composer{flex:none;padding:11px 15px 14px;border-top:1px solid #edf0eb;background:rgba(255,254,250,.98)}
.input-wrap{height:48px;padding:4px 5px 4px 14px;display:flex;align-items:center;gap:8px;border:1px solid #e2eae3;border-radius:16px;background:#fff;transition:border-color .2s,box-shadow .2s}
.input-wrap:focus-within{border-color:#82b298;box-shadow:0 0 0 3px rgba(70,144,103,.1)}
.chat-input{width:100%;min-width:0;border:0;outline:0;color:#244439;background:transparent;font-size:13px}
.chat-input::placeholder{color:#a1aca5}
.send{width:38px;height:38px;flex:none;display:grid;place-items:center;border:0;border-radius:12px;color:#fff;background:linear-gradient(145deg,#267a60,#135c49);box-shadow:0 4px 10px rgba(25,100,76,.2);cursor:pointer;transition:transform .18s,opacity .18s}
.send:hover{transform:translateY(-1px) scale(1.03)}.send:disabled{opacity:.45;cursor:default;transform:none}.send svg{width:17px;height:17px}
.footnote{margin:9px 3px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#9aa69e;font-size:9px}
.footnote a{color:#648c75;text-decoration:none;white-space:nowrap}.footnote a:hover{text-decoration:underline}
.launcher{position:relative;width:64px;height:64px;border:0;border-radius:23px;color:#fff;background:linear-gradient(145deg,#1c8069,#0d594a);box-shadow:0 16px 42px rgba(15,88,71,.28),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;display:grid;place-items:center;transition:transform .25s,box-shadow .25s}
.launcher:hover{transform:translateY(-3px) rotate(-2deg);box-shadow:0 20px 48px rgba(15,88,71,.34)}
.launcher svg{width:27px;height:27px}
.pulse{position:absolute;inset:-7px;border:1px solid rgba(49,139,112,.4);border-radius:29px;animation:pulse 2.7s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(.94);opacity:.58}75%,100%{transform:scale(1.22);opacity:0}}
.launch-label{position:absolute;right:76px;bottom:8px;padding:10px 15px;white-space:nowrap;border:1px solid rgba(225,234,228,.9);border-radius:99px;color:#29473c;background:rgba(255,254,250,.94);box-shadow:0 8px 30px rgba(37,66,53,.1);font-size:12px;font-weight:650;transition:opacity .2s,transform .2s}
#dr-yun-chat.open .launch-label{opacity:0;transform:translateX(8px);pointer-events:none}
.demo-badge{display:none;color:#a48242;font-size:9px;font-weight:750;letter-spacing:.08em}
@media(max-width:520px){
 #dr-yun-chat{right:15px;bottom:max(15px,env(safe-area-inset-bottom))}
 .launcher{width:60px;height:60px;border-radius:21px}
 .pulse{border-radius:27px}
 .launch-label{right:70px}
 .chat-panel{position:fixed;left:12px;right:12px;bottom:calc(87px + env(safe-area-inset-bottom));width:auto;height:min(73dvh,650px);min-height:390px;border-radius:25px}
 .chat-head{height:99px;padding:17px}.messages{padding:17px 14px 10px}.composer{padding:10px 12px 12px}
}
@media(max-width:365px){.chat-panel{left:8px;right:8px;bottom:calc(82px + env(safe-area-inset-bottom));height:72dvh}.brand-title{font-size:19px}.bubble{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="dr-yun-chat">
  <div class="launch-label">Нужна помощь?</div>
  <button class="launcher" type="button" aria-label="Открыть чат" aria-expanded="false">
    <span class="pulse"></span>
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.1 18.1 3.8 21l4.1-1.1c1.2.7 2.6 1.1 4.1 1.1 5 0 9-3.8 9-8.5S17 4 12 4 3 7.8 3 12.5c0 2.1.8 4.1 2.1 5.6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 12.5h.1m4.2 0h.1m4.2 0h.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <section class="chat-panel open" role="dialog" aria-label="Чат с клиникой Dr.Yun" aria-hidden="false">
    <header class="chat-head">
      <div class="brand-icon"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M10 6.5c2 0 3.3 1.1 6 1.1s4-1.1 6-1.1c3.5 0 5.5 2.7 5.5 6.2 0 4.2-3 13.6-6.6 13.6-1.8 0-2.4-5.6-4.9-5.6s-3.1 5.6-4.9 5.6C7.5 26.3 4.5 16.9 4.5 12.7c0-3.5 2-6.2 5.5-6.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.5 13.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <div class="brand-copy">
        <p class="eyebrow"><i></i> КСЦ DR.YUN</p>
        <h1 class="brand-title">Администратор клиники</h1>
        <p class="brand-subtitle">Подскажу по услугам и записи</p>
      </div>
      <button class="close" type="button" aria-label="Закрыть чат"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </header>
    <div class="messages" aria-live="polite">
      <div class="day">Добро пожаловать</div>
    </div>
    <div class="suggestions">
      <button type="button" data-prompt="Хочу записаться на приём">Записаться на приём ↗</button>
      <button type="button" data-prompt="Подскажите стоимость услуги">Узнать стоимость</button>
      <button type="button" data-prompt="Хочу задать вопрос о лечении">Задать вопрос</button>
    </div>
    <form class="composer">
      <div class="input-wrap">
        <input class="chat-input" type="text" maxlength="1200" autocomplete="off" placeholder="Напишите сообщение…" aria-label="Ваше сообщение">
        <button class="send" type="submit" aria-label="Отправить сообщение"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21 3-7.4 18-3.9-7.7L2 9.4 21 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.7 13.3 21 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
      <div class="footnote"><span>Не заменяет консультацию врача</span><a href="https://dr-yun.ru/" target="_blank" rel="noopener">dr-yun.ru ↗</a><span class="demo-badge">ДЕМО</span></div>
    </form>
  </section>
</div>
<script>
(function(){
  "use strict";
  var CONFIG={
    webhookUrl:"https://fugudhustitif.beget.app/webhook/chat",
    demoMode:false, // set true to use sample replies without calling the clinic workflow
    openInitially:true // set false when embedding on the live website
  };
  var root=document.getElementById("dr-yun-chat");
  var panel=root.querySelector(".chat-panel");
  var launcher=root.querySelector(".launcher");
  var close=root.querySelector(".close");
  var form=root.querySelector(".composer");
  var input=root.querySelector(".chat-input");
  var sendButton=root.querySelector(".send");
  var messages=root.querySelector(".messages");
  var suggestions=root.querySelector(".suggestions");
  var badge=root.querySelector(".demo-badge");
  var busy=false;

  function makeId(prefix){
    var token=window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
    return prefix+token;
  }
  function persistentId(store,key,prefix){
    try{
      var id=store.getItem(key);
      if(!id){id=makeId(prefix);store.setItem(key,id);}
      return id;
    }catch(error){return makeId(prefix);}
  }
  var userId=persistentId(window.localStorage,"dryun_chat_user","visitor_");
  var chatId=persistentId(window.sessionStorage,"dryun_chat_session","chat_");

  function timeNow(){
    return new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit"}).format(new Date());
  }
  function tooth(){
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 4c1.4 0 2.3.8 4 .8s2.6-.8 4-.8c2.5 0 4 1.9 4 4.4 0 3-2.1 9.6-4.7 9.6-1.3 0-1.7-4-3.3-4s-2 4-3.3 4C6.1 18 4 11.4 4 8.4 4 5.9 5.5 4 8 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }
  function addMessage(role,text){
    var row=document.createElement("div");
    row.className="message "+role;
    if(role==="assistant"){
      var avatar=document.createElement("div");
      avatar.className="tooth";
      avatar.innerHTML=tooth();
      row.appendChild(avatar);
    }
    var stack=document.createElement("div");
    stack.className="stack";
    var bubble=document.createElement("div");
    bubble.className="bubble";
    bubble.textContent=text;
    var stamp=document.createElement("div");
    stamp.className="stamp";
    stamp.textContent=timeNow();
    stack.appendChild(bubble);
    stack.appendChild(stamp);
    row.appendChild(stack);
    messages.appendChild(row);
    messages.scrollTop=messages.scrollHeight;
  }
  function showTyping(){
    var row=document.createElement("div");
    row.className="typing";
    row.innerHTML='<div class="tooth">'+tooth()+'</div><div class="dots" aria-label="Печатает"><i></i><i></i><i></i></div>';
    messages.appendChild(row);
    messages.scrollTop=messages.scrollHeight;
    return row;
  }
  function demoReply(text){
    var value=text.toLowerCase();
    if(/запис|при[её]м|завтра|сегодня/.test(value))return "Конечно, помогу с записью. На какую услугу и в какой день вам удобно прийти?";
    if(/цен|стоим|сколько/.test(value))return "Подскажите, пожалуйста, какая услуга вас интересует? Проверю информацию в базе клиники.";
    return "Поняла вас. Расскажите чуть подробнее, что именно хотите уточнить — постараюсь помочь.";
  }
  async function getReply(text){
    if(CONFIG.demoMode){
      badge.style.display="inline";
      await new Promise(function(resolve){setTimeout(resolve,650);});
      return demoReply(text);
    }
    var response=await fetch(CONFIG.webhookUrl,{
      method:"POST",
      mode:"cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chatInput:text,userId:userId,chatId:chatId}),
      credentials:"omit",
      cache:"no-store"
    });
    var body=await response.text();
    if(!response.ok)throw new Error("Webhook status "+response.status);
    if(!body.trim())return "Не удалось получить ответ. Попробуйте задать вопрос ещё раз.";
    try{
      var data=JSON.parse(body);
      if(data&&typeof data.output==="string")return data.output;
      if(data&&typeof data.text==="string")return data.text;
    }catch(error){return body;}
    return body;
  }
  async function send(text){
    var clean=String(text||"").trim();
    if(!clean||busy)return;
    addMessage("user",clean);
    suggestions.style.display="none";
    input.value="";
    busy=true;
    input.disabled=true;
    sendButton.disabled=true;
    var typing=showTyping();
    try{
      var reply=await getReply(clean);
      typing.remove();
      addMessage("assistant",reply);
    }catch(error){
      typing.remove();
      addMessage("assistant","Не удалось подключиться к чату. Проверьте доступность вебхука и настройки CORS для dr-yun.ru.");
    }finally{
      busy=false;
      input.disabled=false;
      sendButton.disabled=false;
      input.focus();
    }
  }
  function setOpen(value){
    root.classList.toggle("open",value);
    panel.classList.toggle("open",value);
    panel.setAttribute("aria-hidden",value?"false":"true");
    launcher.setAttribute("aria-expanded",value?"true":"false");
    launcher.setAttribute("aria-label",value?"Закрыть чат":"Открыть чат");
    if(value)setTimeout(function(){input.focus();},180);
  }
  launcher.addEventListener("click",function(){setOpen(!panel.classList.contains("open"));});
  close.addEventListener("click",function(){setOpen(false);});
  form.addEventListener("submit",function(event){event.preventDefault();send(input.value);});
  root.querySelectorAll("[data-prompt]").forEach(function(button){
    button.addEventListener("click",function(){send(button.getAttribute("data-prompt"));});
  });
  addMessage("assistant","Здравствуйте! Я помогу разобраться с услугами клиники и записаться на приём. Что вас интересует?");
  setOpen(CONFIG.openInitially);
})();
</script>
</body>
</html>
